<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>
    <link rel="stylesheet" href="selectors.css">
</head>
<body>

    <h1 id="main-title">CSS Selectors Demonstration</h1>

    <div class="container">
        <p class="intro">This paragraph uses a class selector.</p>
        <p>This paragraph uses an element selector.</p>

        <div class="box">
            <p class="highlight">This is a highlighted paragraph inside a box.</p>
            <button id="special-button">Special Button</button>
        </div>

        <ul class="list">
            <li class="first-item">First item</li>
            <li>Second item</li>
            <li class="last-item">Last item</li>
        </ul>

        <button class="btn">Regular Button</button>
        <button class="btn primary">Primary Button</button>
    </div>

</body>
</html>
