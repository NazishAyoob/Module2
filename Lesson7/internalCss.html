<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>
    <style>
        .green-text {
            font-size: 20px;
            color: green;
        }

        .orange-button {
            background-color: orange;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <p class="green-text">This is an example of internal CSS.</p>

    <button class="orange-button">Click Me</button>

</body>
</html>
