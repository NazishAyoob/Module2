<!DOCTYPE html>
<html>
<head>
    <title>CSS Background Example</title>
    <style>
        .bg-color {
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
        }

        .bg-image {
            background-image: url('https://via.placeholder.com/200x100/cccccc/000000?text=Background');
            background-repeat: no-repeat;
            background-size: cover;
            height: 100px;
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .bg-position {
            background-color: #f0f0f0;
            background-image: url('https://via.placeholder.com/50x50/ff0000/ffffff?text=X');
            background-repeat: no-repeat;
            background-position: right bottom;
            height: 150px;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1>CSS Background Properties</h1>

    <div class="bg-color">
        <h2>Background Color</h2>
        <p>This div has a light blue background color.</p>
    </div>

    <div class="bg-image">
        <h2>Background Image</h2>
        <p>This div has a background image.</p>
    </div>

    <div class="bg-position">
        <h2>Background Position</h2>
        <p>This div shows background positioning (image in bottom-right corner).</p>
    </div>

</body>
</html>
