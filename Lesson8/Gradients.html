<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients Example</title>
    <style>
        .linear-gradient {
            background: linear-gradient(to right, #ff0000, #ffff00);
            height: 100px;
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .radial-gradient {
            background: radial-gradient(circle, #ff0000, #ffff00, #0000ff);
            height: 100px;
            padding: 20px;
            margin: 10px;
            color: white;
        }

        .diagonal-gradient {
            background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
            height: 100px;
            padding: 20px;
            margin: 10px;
            color: white;
        }
    </style>
</head>
<body>

    <h1>CSS Gradients</h1>

    <div class="linear-gradient">
        <h2>Linear Gradient</h2>
        <p>Red to yellow gradient from left to right.</p>
    </div>

    <div class="radial-gradient">
        <h2>Radial Gradient</h2>
        <p>Red to yellow to blue radial gradient.</p>
    </div>

    <div class="diagonal-gradient">
        <h2>Diagonal Gradient</h2>
        <p>Red to green to blue diagonal gradient.</p>
    </div>

</body>
</html>
