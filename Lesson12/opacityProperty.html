<!DOCTYPE html>
<html>
<head>
    <title>CSS Opacity Property</title>
    <style>
        .opaque-box {
            width: 200px;
            height: 120px;
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            margin: 20px;
            opacity: 1;
        }

        .semi-transparent-box {
            width: 200px;
            height: 120px;
            background-color: #2196F3;
            color: white;
            padding: 20px;
            margin: 20px;
            opacity: 0.7;
        }

        .transparent-box {
            width: 200px;
            height: 120px;
            background-color: #FF9800;
            color: white;
            padding: 20px;
            margin: 20px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <h1>CSS Opacity Property</h1>

    <div class="opaque-box">Opacity 1 (fully opaque)</div>
    <div class="semi-transparent-box">Opacity 0.7 (semi-transparent)</div>
    <div class="transparent-box">Opacity 0.4 (more transparent)</div>

    <p>The <strong>opacity</strong> property controls how transparent an element is. Lower values make the element more transparent.</p>

</body>
</html>
